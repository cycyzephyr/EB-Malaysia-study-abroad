<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>马来西亚留学专业查询</title><meta name="description" content="查询马来西亚院校专业、申请要求和学费，按学历、成绩与专业方向初筛适合的课程。"><meta name="theme-color" content="#f5f3ee"><script src="./theme.js?v=bdf87ae09e4a324c"></script><link rel="stylesheet" href="./style.css?v=bdf87ae09e4a324c"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230b0e11%22%2F%3E%3Cpath%20d%3D%22M7%208h8l1%202%201-2h8v16h-8l-1%202-1-2H7z%22%20fill%3D%22%2378d7d0%22%2F%3E%3Cpath%20d%3D%22M16%2010v14%22%20stroke%3D%22%230b0e11%22%20stroke-width%3D%222%22%2F%3E%3C%2Fsvg%3E"></head>
<body class="query-page"><main><div class="title-row"><div><p class="eyebrow">欧亚之桥留学 · 专业查询</p><h1>找到适合你的专业</h1><p class="sub">先选申请阶段和方向，再了解学校、申请条件与学费</p></div><div class="header-tools"><nav class="page-nav" aria-label="主要导航"><a class="page-link featured-link" href="./index.html" aria-current="page">专业查询</a><a class="page-link" href="./match.html">条件匹配</a></nav><button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false"><span aria-hidden="true">☾</span> 夜间模式</button></div></div>
<form id="search"><input id="q" type="search" enterkeyhint="search" aria-label="搜索学校或专业" placeholder="搜索学校或专业，例如：马大经济学"><button>搜索</button></form>
<section class="browse-panel" aria-label="选择专业范围">
  <div class="browse-step"><div class="step-heading"><span class="step-number" aria-hidden="true">01</span><h2>申请哪个阶段？</h2><span class="step-hint">先缩小专业范围</span></div>
    <input id="degree" type="hidden"><div class="stage-controls"><div id="degreeChoices" class="stage-choices"></div><select id="otherDegree" aria-label="其他学历"><option value="">其他学历</option><option value="Diploma">文凭课程</option><option value="Postgraduate Diploma">研究生文凭</option><option value="Postgraduate Certificate">研究生证书</option><option value="Certificate">证书课程</option></select></div>
  </div>
  <div class="browse-step"><div class="step-heading"><span class="step-number" aria-hidden="true">02</span><h2>对哪个方向感兴趣？</h2><span class="step-hint">可同时选择多个方向</span></div>
    <input id="direction" type="hidden"><div class="direction-toolbar"><button id="allDirections" class="browse-all" type="button" aria-pressed="true">暂不限制，浏览全部</button><button id="moreDirections" class="browse-all" type="button" aria-expanded="false" aria-controls="directionChoices">更多方向</button></div><div id="directionChoices" class="browse-directions"></div>
  </div>
  <div class="browse-step school-step"><div class="step-heading"><span class="step-number" aria-hidden="true">03</span><h2>有想去的学校吗？</h2><span class="step-hint">也可以跨学校比较</span></div><div class="filter-label school-control">学校<select id="university" aria-label="学校"><option value="">全部学校</option></select></div></div>
</section>
<details id="filterPanel" class="filter-panel"><summary>更多筛选 · 学院、培养类型与成绩条件</summary><div class="filter-content"><section class="filters advanced-filters">
<div class="filter-label">学院<select id="faculty" aria-label="学院"><option value="">全部学院</option></select></div>
<div class="filter-label">培养类型<select id="type" aria-label="培养类型"><option value="">全部类型</option><option value="Coursework">授课型</option><option value="Research">研究型</option><option value="Mixed Mode">混合型</option><option value="Clinical">临床型</option></select></div>
<label>IELTS 要求不高于<input id="ielts" type="number" inputmode="decimal" min="0" max="9" step="0.5"></label>
<label>CGPA 要求不高于<input id="cgpa" type="number" inputmode="decimal" min="0" max="4" step="0.1"></label>
</section></div></details>
<div id="activeFilters" class="active-filters" aria-label="已选条件" hidden></div>
<p id="count" role="status" aria-live="polite">正在加载专业资料…</p><div id="results"></div><button id="loadMore" class="secondary load-more" type="button" hidden>显示更多</button><footer class="site-footer"><div class="footer-credit"><span class="site-brand">欧亚之桥留学</span><span id="dataDate"></span></div><span>申请条件以院校最新官方要求为准</span></footer></main>
<dialog id="detail"><button class="close" aria-label="关闭">×</button><div id="detailBody"></div></dialog>
<dialog id="copyFallback"><button class="close" aria-label="关闭">×</button><h2>复制文本</h2><p>自动复制未完成，请长按选中下方文字复制。</p><textarea id="copyText" readonly rows="12" aria-label="可复制的专业资料"></textarea></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="./ui.js?v=bdf87ae09e4a324c"></script><script src="./detail.js?v=bdf87ae09e4a324c"></script><script src="./filters.js?v=bdf87ae09e4a324c"></script><script src="./search.js?v=bdf87ae09e4a324c"></script><script src="./hosted-data.js?v=bdf87ae09e4a324c"></script><script src="./app.js?v=bdf87ae09e4a324c"></script></body></html>
